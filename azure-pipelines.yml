trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dockerImageName: powerops-api

stages:

- stage: Build
  displayName: Build and Test

  jobs:
  - job: BuildTest
    displayName: Build PowerOps

    steps:

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.0.x

    - script: |
        dotnet restore PowerOps.slnx
      displayName: Restore dependencies

    - script: |
        dotnet build PowerOps.slnx \
          --configuration $(buildConfiguration) \
          --no-restore
      displayName: Build application

    - script: |
        dotnet test PowerOps.slnx \
          --configuration $(buildConfiguration) \
          --no-build
      displayName: Run automated tests

- stage: Container
  displayName: Build Container
  dependsOn: Build

  jobs:
  - job: DockerBuild
    displayName: Build Docker Image

    steps:

    - script: |
        docker build \
          -t $(dockerImageName):$(Build.BuildId) .
      displayName: Build PowerOps Docker image